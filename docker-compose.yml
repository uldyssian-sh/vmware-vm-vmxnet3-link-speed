version: '3.8'

services:
  vmxnet3-tool:
    build: .
    image: vmxnet3-configurator:latest
    container_name: vmxnet3-tool
    volumes:
      - ./config:/opt/config
      - ./logs:/opt/logs
    environment:
      - VCENTER_SERVER=${VCENTER_SERVER}
      - VCENTER_USERNAME=${VCENTER_USERNAME}
      - VCENTER_PASSWORD=${VCENTER_PASSWORD}
    networks:
      - vmware-net

networks:
  vmware-net:
    driver: bridge