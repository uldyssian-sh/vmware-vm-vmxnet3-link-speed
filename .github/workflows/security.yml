name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run security checks
      run: |
        echo "Security policy exists"
        test -f SECURITY.md && echo "✅ SECURITY.md found"
        test -f .github/SECURITY.md && echo "✅ .github/SECURITY.md found"
