name: Security

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Security policy check
      run: |
        echo "✅ Security policy exists"
        test -f SECURITY.md && echo "✅ SECURITY.md found"
